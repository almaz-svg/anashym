{
  "openapi": "3.0.3",
  "info": {
    "title": "Кондитерская — локальный API",
    "version": "0.3.0",
    "description": "Session + CSRF. All financial amounts are decimal KZT strings, timestamps RFC3339. Business writes require Idempotency-Key. Organization and courier object scoping is enforced server-side. Kaspi is manually verified: a proof is never automatic confirmation. Cursors are opaque and must be used with unchanged filters. Property-level validation is described by field_errors; conditional validation is enforced by each workflow."
  },
  "servers": [
    {
      "url": "/api/v1"
    }
  ],
  "security": [
    {
      "sessionAuth": []
    }
  ],
